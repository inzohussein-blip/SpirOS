conky.config = {
    alignment = 'top_left', gap_x = 48, gap_y = 44,
    own_window = true, own_window_type = 'desktop', own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true, use_xft = true, font = 'Noto Sans:size=12',
    default_color = 'e9e7f5', color1 = '9b82ff', color2 = '3ddc97',
    update_interval = 5, draw_shades = false, draw_outline = false, draw_borders = false,
    minimum_width = 420,
};
conky.text = [[
${font Noto Sans:light:size=64}${time %H:%M}${font}
${font Noto Sans:size=16}${color1}${time %A, %d %B}${color}${font}

${font Noto Sans:bold:size=11}${color2}SpirOS Linux${color}${font}
${font Noto Sans:size=10}RAM ${memperc}%   ·   CPU ${cpu}%${font}
