name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Track B1: bundle QEMU (prebuilt for Android by Termux, GPL). If this step fails
      # the APK still builds; the Lab screen then reports that the engine is missing.
      - name: Bundle QEMU engine
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends patchelf
          python3 tools/fetch_qemu.py

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SpirOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
