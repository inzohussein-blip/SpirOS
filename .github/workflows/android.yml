name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a downloadable pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Track B1: bundle QEMU (prebuilt for Android by Termux, GPL). If this step fails
      # the APK still builds; the Lab screen then reports that the engine is missing.
      - name: Bundle QEMU engine
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends patchelf
          python3 tools/fetch_qemu.py

      - name: Check API levels (lint NewApi)
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SpirOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A direct .apk link that opens on a phone (Actions artifacts are always zipped):
      # https://github.com/<owner>/<repo>/releases/download/dev-latest/SpirOS.apk
      - name: Publish APK to the dev-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpirOS.apk
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest SpirOS.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "SpirOS – آخر نسخة تجريبية" \
            --notes "نسخة تجريبية مبنية تلقائيًا من ${{ github.sha }}. للتثبيت: نزّل SpirOS.apk وافتحه."
