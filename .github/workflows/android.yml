name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older run: only one run publishes dev-latest at a time.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the APK as a downloadable pre-release
  actions: read # see whether the Linux images are being rebuilt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Track B1: bundle QEMU (prebuilt for Android by Termux, GPL), plus its keymaps.
      # If this step fails the APK still builds; the Lab screen then reports it.
      - name: Bundle QEMU engine
        continue-on-error: true
        run: |
          python3 tools/fetch_qemu.py --arch aarch64 --out app/src/secure/jniLibs/arm64-v8a --data-out app/src/secure/assets/qemu
          python3 tools/fetch_qemu.py --arch x86_64 --out app/src/secure/jniLibs/x86_64

      # SpirOS Engine (Linux + AI helper): proot from Termux, with its loader.
      - name: Bundle proot
        continue-on-error: true
        run: |
          for a in "aarch64 arm64-v8a" "x86_64 x86_64"; do
            set -- $a
            python3 tools/fetch_qemu.py --arch $1 --out app/src/engine/jniLibs/$2 \
              --package proot --executable bin/proot --name libproot.so \
              --extra libexec/proot/loader=libproot-loader.so
          done

      - name: Check API levels (lint NewApi)
        run: ./gradlew --no-daemon lintSecureDebug lintEngineDebug

      # Debug APKs carry the CI self-tests; release APKs (R8-optimised, faster) are
      # what people install.
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Name APKs
        run: |
          OUT=app/build/outputs/apk
          cp $OUT/secure/release/app-secure-arm64-v8a-release.apk SpirOS.apk
          cp $OUT/engine/release/app-engine-arm64-v8a-release.apk SpirOS-Engine.apk
          cp $OUT/secure/debug/app-secure-x86_64-debug.apk SpirOS-x86_64.apk
          cp $OUT/engine/debug/app-engine-x86_64-debug.apk SpirOS-Engine-x86_64.apk
          # SpirOS checks these before installing the engine (and its signature too).
          sha256sum SpirOS-Engine.apk > SpirOS-Engine.apk.sha256
          sha256sum SpirOS-Engine-x86_64.apk > SpirOS-Engine-x86_64.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SpirOS-debug-apk
          path: SpirOS.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SpirOS-x86_64-apk
          path: SpirOS-x86_64.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SpirOS-Engine-apk
          path: SpirOS-Engine.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SpirOS-Engine-x86_64-apk
          path: SpirOS-Engine-x86_64.apk
          if-no-files-found: error

      # A direct .apk link that opens on a phone (Actions artifacts are always zipped):
      # https://github.com/<owner>/<repo>/releases/download/dev-latest/SpirOS.apk
      - name: Publish APK to the dev-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="SpirOS.apk SpirOS-Engine.apk SpirOS-Engine.apk.sha256 SpirOS-Engine-x86_64.apk SpirOS-Engine-x86_64.apk.sha256"
          NOTES="نسخة تجريبية مبنية تلقائيًا من ${{ github.sha }}. ثبّت SpirOS.apk فقط. محرك لينكس والذكاء الاصطناعي (SpirOS-Engine) يثبّته SpirOS بنفسه من داخل التطبيق عند أول استخدام بعد التحقق من بصمته وتوقيعه."
          # Update the release in place (the download links never disappear), with
          # retries for GitHub's occasional refusals.
          for attempt in 1 2 3 4 5; do
            if gh release view dev-latest >/dev/null 2>&1; then
              gh release upload dev-latest $FILES --clobber &&
                gh release edit dev-latest --prerelease --notes "$NOTES" && exit 0
            else
              gh release create dev-latest $FILES --prerelease --target "${{ github.sha }}" \
                --title "SpirOS – آخر نسخة تجريبية" --notes "$NOTES" && exit 0
            fi
            echo "publish attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          exit 1

  # Fast check of the guest itself (Alpine URLs, kernel arguments, devices) with the
  # distribution's QEMU, using the same script as the in-app definition.
  lab-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Boot the Lab guest with desktop QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          mkdir -p work/qemu-data
          BASE=https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/netboot
          curl -fSL -o work/vmlinuz-virt "$BASE/vmlinuz-virt"
          curl -fSL -o work/initramfs-virt "$BASE/initramfs-virt"
          sh tools/lab_boot.sh qemu-system-aarch64 "" "$PWD/work" 600

  # End-to-end: the real APK on an Android 14 emulator runs the in-app self-test
  # (bundled QEMU from nativeLibraryDir, guest download, VNC display, boot).
  lab-device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SpirOS-x86_64-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Lab self-test on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/lab_device_test.sh SpirOS-x86_64.apk

  # End-to-end: SpirOS + the SpirOS Engine on an Android 14 emulator. SpirOS binds to
  # the engine, which downloads the Debian rootfs (amd64), runs proot + Xvnc + Xfce;
  # SpirOS draws the desktop from the socket the engine hands over, then chats with
  # the private AI the engine runs.
  linux-device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # The Linux systems are built by linux-rootfs.yml (often in the same push):
      # wait until the default one (Mint Xfce, amd64) is published.
      - name: Wait for the Linux system image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            # Images being rebuilt on this branch: wait so the test never
            # downloads one while it is being replaced.
            busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow linux-rootfs.yml --branch "$GITHUB_REF_NAME" \
              --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "$busy" = 0 ] && gh release view linux-rootfs -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'ubuntu-xfce-amd64.tar.xz.sha256'; then
              echo "image published"; exit 0
            fi
            sleep 60
          done
          echo "image not published in time"; exit 1
      - uses: actions/download-artifact@v4
        with:
          name: SpirOS-Engine-x86_64-apk
      - uses: actions/download-artifact@v4
        with:
          name: SpirOS-x86_64-apk
      - name: Free disk space for the emulator
        run: |
          # The Linux self-test needs ~10 GB for the emulator's data partition plus the
          # rootfs; hosted runners sometimes start with too little free space.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Linux desktop self-test on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Linux desktop first (installs the rootfs), then the private AI inside it.
          script: |
            adb install -r SpirOS-Engine-x86_64.apk
            bash tools/lab_device_test.sh SpirOS-x86_64.apk com.spiros.app .LinuxSelfTestActivity linux-selftest.log 25
            bash tools/lab_device_test.sh SpirOS-x86_64.apk com.spiros.app .AiSelfTestActivity ai-selftest.log 20
