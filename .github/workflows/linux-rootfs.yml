name: Linux rootfs

# Builds the SpirOS Linux systems (Ubuntu 24.04 in Linux Mint style, one image per
# desktop: Xfce, MATE, Cinnamon) and publishes them to the "linux-rootfs" release,
# where the SpirOS Engine downloads the one the user picks.
on:
  push:
    paths:
      - "linux/**"
      - "app/src/main/assets/linux/**"
      - ".github/workflows/linux-rootfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the linux-rootfs release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view linux-rootfs >/dev/null 2>&1 || gh release create linux-rootfs \
            --prerelease --target "${{ github.sha }}" \
            --title "SpirOS Linux – Ubuntu 24.04 (Mint style)" \
            --notes "أنظمة لينكس (Ubuntu 24.04 بمظهر Linux Mint: Xfce وMATE وCinnamon) يُنزّلها محرك SpirOS من داخل التطبيق."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        desktop: [spiros, xfce, mate, cinnamon]
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NAME: ubuntu-${{ matrix.desktop }}-${{ matrix.arch }}.tar.xz
    steps:
      - uses: actions/checkout@v4
      - name: Build rootfs (${{ matrix.desktop }}, ${{ matrix.arch }})
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends debootstrap xz-utils ubuntu-keyring librsvg2-bin
          sudo sh linux/build-rootfs.sh ${{ matrix.arch }} ${{ matrix.desktop }} "$PWD/$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          # Size shown in SpirOS before downloading.
          stat -c %s "$NAME" > "$NAME.size"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload linux-rootfs --clobber "$NAME" "$NAME.sha256" "$NAME.size"
