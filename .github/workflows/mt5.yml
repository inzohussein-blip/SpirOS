name: MT5 package

# "MetaTrader 5 full" for SpirOS Linux. probe: tries Wine versions on x86-64 and
# shows (screenshots + window titles) which ones run MT5. mt5: builds the package
# on a real ARM64 machine (Box64 + the Wine in linux/mt5/wine-url.txt + MT5),
# proves it runs with a screenshot, and publishes it for SpirOS to download.
on:
  push:
    paths:
      - "linux/mt5/**"
      - ".github/workflows/mt5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      urls: ${{ steps.pick.outputs.urls }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/Kron4ek/Wine-Builds/releases?per_page=60" --jq '.[].assets[].browser_download_url' | grep -E 'amd64-wow64\.tar\.xz$' > all.txt
          cat all.txt | head -n 80
          { grep -E '/wine-10\.0-amd64' all.txt; grep -E '/wine-9\.[0-9]+-amd64' all.txt | head -n 1
            grep -E '/wine-10\.[0-9]+-amd64' all.txt | head -n 1; grep -E '/wine-10\.[0-9]+-staging-amd64' all.txt | head -n 1
            grep -E '/wine-11\.[0-9]+-amd64' all.txt | head -n 2; grep -E '/wine-11\.[0-9]+-staging-amd64' all.txt | head -n 2; } | sort -u > pick.txt
          cat pick.txt
          echo "urls=$(jq -R . pick.txt | jq -sc .)" >> "$GITHUB_OUTPUT"

  probe:
    if: github.event_name == 'workflow_dispatch'
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.versions.outputs.urls) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick x11-utils xz-utils libfreetype6 libfontconfig1 libgnutls30t64
      - name: Try MT5 with this Wine
        env:
          WINE_URL: ${{ matrix.url }}
          PROBE: "1"
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/build-mt5.sh "$PWD/out" 2>&1 | grep -v BOX64 | tail -n 40
          echo "$WINE_URL" > out/wine.txt
          echo "NAME=$(basename "$WINE_URL" .tar.xz)" >> "$GITHUB_ENV"
      - name: Save proof
        if: always()
        run: |
          cd out && rm -f mt5-full.tar.xz* && git init -q && git checkout -q -b ci-mt5-probe-${{ env.NAME }}
          git config user.name "SpirOS CI" && git config user.email "ci@spiros.invalid"
          git add . && git commit -qm "MT5 proof ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-mt5-probe-${{ env.NAME }}

  mt5:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools and Box64
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick x11-utils cmake build-essential python3 git xz-utils \
            libfreetype6 libfontconfig1 libgnutls30t64 libx11-6 libxext6 libxrender1 libxrandr2 libxinerama1 libxcursor1 libxcomposite1 libxi6
          git clone --depth 1 --branch v0.3.4 https://github.com/ptitSeb/box64 /tmp/box64
          cmake -S /tmp/box64 -B /tmp/box64/build -DARM_DYNAREC=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/box64/build -j$(nproc)
          sudo cmake --install /tmp/box64/build
      - name: Build MT5 full (Wine via Box64)
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/build-mt5.sh "$PWD/out" 2>&1 | grep -v '^\[BOX64\]' | tail -n 120
          # Publish only an MT5 that really opens (main window "MetaTrader 5 - ...").
          grep -q '"MetaTrader 5' out/windows-arm64.txt
          cd out && sha256sum mt5-full.tar.xz | tee mt5-full.tar.xz.sha256
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload linux-rootfs --clobber out/mt5-full.tar.xz out/mt5-full.tar.xz.sha256
      - name: Save proof
        if: always()
        run: |
          cd out && rm -f mt5-full.tar.xz* && git init -q && git checkout -q -b ci-mt5-arm64
          git config user.name "SpirOS CI" && git config user.email "ci@spiros.invalid"
          git add . && git commit -qm "MT5 proof ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-mt5-arm64
