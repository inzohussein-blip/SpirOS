name: MT5 and MT4 packages

# "MetaTrader 5 full" for SpirOS Linux. probe: tries Wine versions on x86-64 and
# shows (screenshots + window titles) which ones run MT5. mt5: builds the package
# on a real ARM64 machine (Box64 + the Wine in linux/mt5/wine-url.txt + MT5),
# proves it runs with a screenshot, and publishes it for SpirOS to download.
on:
  push:
    paths:
      - "linux/mt5/**"
      - ".github/workflows/mt5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MT5 is installed on x86-64 (its installer is too slow/unreliable under Box64);
  # the Windows prefix is the same for every CPU.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick x11-utils xz-utils libfreetype6 libfontconfig1 libgnutls30t64
      - name: Install MT5 and MT4 (official installers, x86-64)
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/install-mt.sh "$PWD/out" 2>&1 | tail -n 60
          ls -la out
          test -f out/mt5-app.tar
      - uses: actions/upload-artifact@v4
        with:
          name: mt-apps
          path: out/*-app.tar
          retention-days: 3
      - name: Save proof
        if: always()
        run: |
          mkdir -p out && date > out/run.txt && cd out && rm -f *.tar && git init -q && git checkout -q -b ci-mt-amd64
          git config user.name "SpirOS CI" && git config user.email "ci@spiros.invalid"
          git add . && git commit -qm "MT x86-64 proof ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-mt-amd64

  # ARM64 phones: inside Ubuntu 26.04 like SpirOS Linux, Hangover's 26.04 build.
  arm64:
    needs: package
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    timeout-minutes: 90
    steps:
      - name: Base tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sudo git curl ca-certificates gh xvfb xauth imagemagick x11-utils xz-utils gawk
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Hangover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/AndreRH/hangover/releases/latest --jq '.tag_name, (.assets[].browser_download_url)' | tee rel.txt
          URL=$(grep -iE 'resolute|26\.04|2604' rel.txt | grep -i arm64 | head -n 1)
          [ -n "$URL" ] || URL=$(grep -iE 'debian|ubuntu' rel.txt | grep -i arm64 | head -n 1)
          echo "using $URL"
          mkdir -p hv && curl -fsSL "$URL" -o hv/pkg && cd hv && (tar -xf pkg 2>/dev/null || unzip -q pkg 2>/dev/null || true)
          mkdir -p /tmp/debs && find . -name '*.deb' -exec cp {} /tmp/debs/ \; && ls -la /tmp/debs
          # Runtime libraries Hangover needs (SpirOS Linux has them too).
          DEBIAN_FRONTEND=noninteractive sudo -E apt-get install -y $(for d in /tmp/debs/*.deb; do dpkg-deb -f "$d" Depends; done | tr ',' '\n' | sed 's/(.*)//;s/|.*//;s/ //g' | grep -v '^$' | grep -v hangover | sort -u) || true
      - uses: actions/download-artifact@v4
        with:
          name: mt-apps
          path: apps
      - name: Build and test the ARM64 packages
        run: |
          set -o pipefail
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/pack-wine-arm64.sh /tmp/debs "$PWD/apps" "$PWD/out" 2>&1 | tail -n 60
          cd out && for f in *.tar.xz; do sha256sum "$f" > "$f.sha256"; done && ls -la
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release upload linux-rootfs --clobber *.tar.xz *.tar.xz.sha256 -R ${{ github.repository }}
      - name: Save proof
        if: always()
        run: |
          mkdir -p out && date > out/run.txt && cd out && rm -f *.tar.xz* && git init -q && git checkout -q -b ci-mt5-arm64
          git config user.name "SpirOS CI" && git config user.email "ci@spiros.invalid"
          git add . && git commit -qm "MT ARM64 proof ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-mt5-arm64

  # Manual: which Wine builds open MT5 (x86-64).
  versions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      urls: ${{ steps.pick.outputs.urls }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/Kron4ek/Wine-Builds/releases?per_page=60" --jq '.[].assets[].browser_download_url' | grep -E 'amd64-wow64\.tar\.xz$' > all.txt
          cat all.txt | head -n 80
          { grep -E '/wine-10\.0-amd64' all.txt; grep -E '/wine-9\.[0-9]+-amd64' all.txt | head -n 1
            grep -E '/wine-10\.[0-9]+-amd64' all.txt | head -n 1; grep -E '/wine-10\.[0-9]+-staging-amd64' all.txt | head -n 1
            grep -E '/wine-11\.[0-9]+-amd64' all.txt | head -n 2; grep -E '/wine-11\.[0-9]+-staging-amd64' all.txt | head -n 2; } | sort -u > pick.txt
          cat pick.txt
          echo "urls=$(jq -R . pick.txt | jq -sc .)" >> "$GITHUB_OUTPUT"

  probe:
    if: github.event_name == 'workflow_dispatch'
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.versions.outputs.urls) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick x11-utils xz-utils libfreetype6 libfontconfig1 libgnutls30t64
      - name: Try MT5 with this Wine
        env:
          WINE_URL: ${{ matrix.url }}
          PROBE: "1"
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/build-mt5.sh "$PWD/out" 2>&1 | grep -v BOX64 | tail -n 40
          echo "$WINE_URL" > out/wine.txt
          echo "NAME=$(basename "$WINE_URL" .tar.xz)" >> "$GITHUB_ENV"
      - name: Save proof
        if: always()
        run: |
          mkdir -p out && date > out/run.txt && cd out && rm -f mt5-full.tar.xz* && git init -q && git checkout -q -b ci-mt5-probe-${{ env.NAME }}
          git config user.name "SpirOS CI" && git config user.email "ci@spiros.invalid"
          git add . && git commit -qm "MT5 proof ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-mt5-probe-${{ env.NAME }}

