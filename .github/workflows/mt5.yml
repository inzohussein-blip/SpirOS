name: MT5 package

# "MetaTrader 5 full" for SpirOS Linux. probe: tries Wine versions on x86-64 and
# shows (screenshots + window titles) which ones run MT5. mt5: builds the package
# on a real ARM64 machine (Box64 + the Wine in linux/mt5/wine-url.txt + MT5),
# proves it runs with a screenshot, and publishes it for SpirOS to download.
on:
  push:
    paths:
      - "linux/mt5/**"
      - ".github/workflows/mt5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MT5 is installed on x86-64 (its installer is too slow/unreliable under Box64);
  # the Windows prefix is the same for every CPU.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick x11-utils xz-utils libfreetype6 libfontconfig1 libgnutls30t64
      - name: Install MT5 into a Wine prefix
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/build-mt5.sh "$PWD/out" 2>&1 | tail -n 40
          cat out/windows-amd64.txt
          grep -q '"MetaTrader 5' out/windows-amd64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mt5-full
          path: out/mt5-full.tar
          retention-days: 3

  # Runs that package on a real ARM64 machine through Box64.
  arm:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        box64: [v0.4.4, main]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools and Box64
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick x11-utils cmake build-essential python3 git xz-utils \
            libfreetype6 libfontconfig1 libgnutls30t64 libx11-6 libxext6 libxrender1 libxrandr2 libxinerama1 libxcursor1 libxcomposite1 libxi6
          git clone --depth 1 --branch ${{ matrix.box64 }} https://github.com/ptitSeb/box64 /tmp/box64
          cmake -S /tmp/box64 -B /tmp/box64/build -DARM_DYNAREC=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/box64/build -j$(nproc)
          sudo cmake --install /tmp/box64/build
      - uses: actions/download-artifact@v4
        with:
          name: mt5-full
      - name: Run MT5 through Box64
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/run-mt5.sh mt5-full.tar "$PWD/out" 2>&1 | grep -v '^\[BOX64\]' | tail -n 30
          mkdir -p box && cp "$(command -v box64)" box/box64
      - uses: actions/upload-artifact@v4
        with:
          name: box64-${{ matrix.box64 }}
          path: box/box64
          retention-days: 3
      - name: Save proof
        if: always()
        run: |
          mkdir -p out && date > out/run.txt && cd out && git init -q && git checkout -q -b ci-mt5-arm-box64-${{ matrix.box64 }}
          git config user.name "SpirOS CI" && git config user.email "ci@spiros.invalid"
          git add . && git commit -qm "MT5 ARM proof ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-mt5-arm-box64-${{ matrix.box64 }}

  # Package + the Box64 that ran it, compressed and published for SpirOS.
  publish:
    needs: [package, arm]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Pack and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R art | head -n 20
          B=$(ls art/box64-v0.4.4/box64 art/box64-main/box64 2>/dev/null | head -n 1)
          [ -n "$B" ] || { echo "MT5 did not run on ARM64: not publishing"; exit 1; }
          echo "Box64: $B"
          mkdir -p p/box64 && cp "$B" p/box64/box64 && chmod 755 p/box64/box64
          cp art/mt5-full/mt5-full.tar mt5-full.tar
          tar --numeric-owner -C p -rf mt5-full.tar box64
          xz -T0 -6 mt5-full.tar
          sha256sum mt5-full.tar.xz | tee mt5-full.tar.xz.sha256
          gh release upload linux-rootfs --clobber mt5-full.tar.xz mt5-full.tar.xz.sha256 -R ${{ github.repository }}

  # Manual: which Wine builds open MT5 (x86-64).
  versions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      urls: ${{ steps.pick.outputs.urls }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/Kron4ek/Wine-Builds/releases?per_page=60" --jq '.[].assets[].browser_download_url' | grep -E 'amd64-wow64\.tar\.xz$' > all.txt
          cat all.txt | head -n 80
          { grep -E '/wine-10\.0-amd64' all.txt; grep -E '/wine-9\.[0-9]+-amd64' all.txt | head -n 1
            grep -E '/wine-10\.[0-9]+-amd64' all.txt | head -n 1; grep -E '/wine-10\.[0-9]+-staging-amd64' all.txt | head -n 1
            grep -E '/wine-11\.[0-9]+-amd64' all.txt | head -n 2; grep -E '/wine-11\.[0-9]+-staging-amd64' all.txt | head -n 2; } | sort -u > pick.txt
          cat pick.txt
          echo "urls=$(jq -R . pick.txt | jq -sc .)" >> "$GITHUB_OUTPUT"

  probe:
    if: github.event_name == 'workflow_dispatch'
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.versions.outputs.urls) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick x11-utils xz-utils libfreetype6 libfontconfig1 libgnutls30t64
      - name: Try MT5 with this Wine
        env:
          WINE_URL: ${{ matrix.url }}
          PROBE: "1"
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash linux/mt5/build-mt5.sh "$PWD/out" 2>&1 | grep -v BOX64 | tail -n 40
          echo "$WINE_URL" > out/wine.txt
          echo "NAME=$(basename "$WINE_URL" .tar.xz)" >> "$GITHUB_ENV"
      - name: Save proof
        if: always()
        run: |
          mkdir -p out && date > out/run.txt && cd out && rm -f mt5-full.tar.xz* && git init -q && git checkout -q -b ci-mt5-probe-${{ env.NAME }}
          git config user.name "SpirOS CI" && git config user.email "ci@spiros.invalid"
          git add . && git commit -qm "MT5 proof ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-mt5-probe-${{ env.NAME }}

